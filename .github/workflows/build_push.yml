name: CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build MatroneScan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension
        run: |
          ./gradlew :src:es:matronescan:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatroneScan
          path: "**/*.apk"
          retention-days: 7
